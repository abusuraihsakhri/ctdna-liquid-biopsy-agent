[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctdna-liquid-biopsy-engine"
version = "2.0.0"
description = "LiquidBiopsy Sentinel: Circulating Tumor DNA (ctDNA) & Minimal Residual Disease Tracker"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ctdna-liquid-biopsy-engine = "ctdna_liquid_biopsy_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/ctdna-liquid-biopsy-engine"
Repository = "https://github.com/abusuraihsakhri/ctdna-liquid-biopsy-engine.git"
