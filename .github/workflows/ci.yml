name: ctDNA test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
      - name: Compile Python files
        run: python -m compileall -q agents ctdna_liquid_biopsy_agent cli.py input_validation.py
      - name: Check static demonstrator JavaScript
        run: node tests/web_smoke.cjs
      - name: Verify package entry points
        run: |
          ctdna-liquid-biopsy-engine --help
          ctdna-clinical --help
      - name: Run tests
        run: python -m pytest -q
      - name: Verify audit chain
        run: |
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
